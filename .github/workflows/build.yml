name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run build and asset scripts if present
        run: |
          if [ -f "بناء-www.js" ]; then
            node "بناء-www.js"
          fi
          if [ -f "apply-android-assets.js" ]; then
            node "apply-android-assets.js"
          fi

      - name: Build Android APK
        run: |
          if grep -q '"android:add"' package.json && [ ! -d "android" ]; then
            npm run android:add
          fi
          if grep -q '"android:apk"' package.json; then
            npm run android:apk
          elif [ -d "android" ]; then
            cd android && chmod +x gradlew && ./gradlew assembleDebug
          else
            npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyadiKhair-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
