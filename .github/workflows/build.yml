name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp committee-logo.png www/ 2>/dev/null || true
          cp apple-touch-icon.png www/ 2>/dev/null || true
          echo '{"name":"ayadi","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core @capacitor/cli
      - name: Init Capacitor
        run: |
          npx cap init "Ayadi Al Khair" com.ayadi.khair --web-dir=www || true
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayadi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
