<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b3a">
<title>لجنة أيادي الخير للخدمة الإنسانية</title>
<style>
:root{--green:#0f6b3a;--green2:#128045;--maroon:#8b1e2d;--cream:#fffdf6;--gold:#c99b2e;--muted:#64748b;--line:rgba(232,220,192,0.7)}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f8f5ec,#eef5ee);color:#132017;font-family:Tahoma,Arial,sans-serif;padding-bottom:90px} button,input,textarea,select{font-family:inherit}
.app{max-width:920px;margin:0 auto;min-height:100vh;background:transparent}
.top{background:linear-gradient(135deg,rgba(10,83,45,0.94),rgba(17,129,70,0.94));color:#fff;border-radius:0 0 34px 34px;padding:18px 18px 22px;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.top h1{font-size:24px;margin:0 0 5px;font-weight:900}.top p{margin:0;opacity:.9;font-size:14px}
.card{background:rgba(255,255,255,0.88);border:1px solid var(--line);border-radius:18px;padding:14px;margin:14px;backdrop-filter:blur(6px)}
.balance{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.bal{background:rgba(255,253,246,0.85);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;backdrop-filter:blur(4px)}.bal b{font-size:20px;display:block;color:var(--green)}
.tabs{display:flex;gap:8px;margin:14px}.tabs button{flex:1;padding:12px;border:0;border-radius:12px;background:rgba(232,224,200,0.75);font-weight:900;cursor:pointer;backdrop-filter:blur(4px)}.tabs button.active{background:rgba(15,107,58,0.92);color:#fff}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;background:rgba(255,255,255,0.9)}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:rgba(15,107,58,0.95);color:#fff;font-weight:900;cursor:pointer;font-size:16px}
.btn2{background:rgba(255,255,255,0.85);color:var(--green);border:2px solid var(--green)}
.receipt{background:rgba(255,255,255,0.88);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 14px;backdrop-filter:blur(6px)}
.receipt b{color:var(--green)} .muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px}.row button{flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;background:rgba(248,245,236,0.8);font-weight:bold;cursor:pointer}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(15,107,58,0.92);color:#fff;text-align:center;padding:12px;font-size:13px;z-index:20;backdrop-filter:blur(8px)}
.icon,.tabs button,.bal,.receipt{opacity:0.95}
.icon{background:transparent !important}
</style>
</head>
<body>
<div class="app">
<div class="top">
<h1 id="uiCommittee">لجنة أيادي الخير للخدمة الإنسانية</h1>
<p id="uiSchoolWell">مدرسة الهدى الخضراء - بئر وحفير الهدى الخضراء</p>
<p id="uiSubtitle">نظام إيصالات التوريد والصرف</p>
</div>
<div class="card">
<h3 style="margin:0">الرصيد الحالي</h3>
<div class="balance" style="margin-top:10px">
<div class="bal"><span>اللجنة</span><b id="balCommittee">0</b></div>
<div class="bal"><span>المدرسة</span><b id="balSchool">0</b></div>
<div class="bal"><span>الحفير</span><b id="balWell">0</b></div>
</div>
</div>
<div class="tabs">
<button class="active" onclick="setSection('committee',this)">اللجنة</button>
<button onclick="setSection('school',this)">المدرسة</button>
<button onclick="setSection('well',this)">الحفير</button>
</div>
<div id="adminLoginBox" class="card">
<h3 style="margin:0">دخول الأدمن</h3>
<input id="adminEmail" placeholder="الإيميل">
<input id="adminPassword" type="password" placeholder="كلمة السر">
<button class="btn" onclick="adminLogin(document.getElementById('adminEmail').value, document.getElementById('adminPassword').value)">تسجيل دخول</button>
<p class="muted" style="text-align:center">الزوار يمكنهم التصفح بدون تسجيل دخول</p>
</div>
<div class="card" data-admin-only>
<h3 style="margin:0">إضافة إيصال جديد</h3>
<select id="fType"><option value="deposit">توريد</option><option value="expense">صرف</option></select>
<input id="fPerson" placeholder="الاسم / الجهة">
<input id="fAmount" type="number" placeholder="المبلغ">
<input id="fRef" placeholder="المرجع / رقم التحويل">
<textarea id="fStatement" placeholder="البيان"></textarea>
<button class="btn" onclick="addReceipt()">حفظ الإيصال</button>
</div>
<div class="card">
<input id="searchBox" placeholder="بحث في الإيصالات..." oninput="render()">
</div>
<div id="list"></div>
<div class="card" data-admin-only>
<div class="row">
<button onclick="exportBackup()">تصدير نسخة احتياطية</button>
<button onclick="adminLogout()">خروج الأدمن</button>
</div>
</div>
<div class="card">
<p><b>المحاسب:</b> <span id="uiAccountant">عبدالله بخيت</span></p>
<p><b>أمين الخزينة:</b> <span id="uiTreasurer">عباس علي</span></p>
<p class="muted" id="uiFooter">تم إنشاء هذا الإيصال إلكترونيًا بواسطة نظام لجنة أيادي الخير</p>
</div>
</div>
<footer>جميع الحقوق محفوظة - مطور التطبيق عبدالله بخيت ابراهيم</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://blxavmlfwknznwqqcoax.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VIEGoovGujrIW1Srk5n-Eg_LMOHd9WZ';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentSection = 'committee';
let receipts = JSON.parse(localStorage.getItem('ayadi_receipts') || '[]');
let isAdmin = localStorage.getItem('ayadi_isAdmin') === 'true';
function setSection(s, btn){
  currentSection = s;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  render();
}
function updateUIForRole(){
  document.querySelectorAll('[data-admin-only]').forEach(el => { el.style.display = isAdmin ? '' : 'none'; });
  const box = document.getElementById('adminLoginBox');
  if(box) box.style.display = isAdmin ? 'none' : 'block';
}
async function adminLogin(email, password){
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error) return alert('بيانات غير صحيحة');
  isAdmin = true;
  localStorage.setItem('ayadi_isAdmin', 'true');
  updateUIForRole(); render();
  alert('مرحباً بك يا أدمن');
}
async function adminLogout(){
  await supabaseClient.auth.signOut();
  isAdmin = false;
  localStorage.setItem('ayadi_isAdmin', 'false');
  updateUIForRole(); render();
}
function saveLocal(){ localStorage.setItem('ayadi_receipts', JSON.stringify(receipts)); }
async function loadSettings(){
  try{
    const { data } = await supabaseClient.from('settings').select('*').eq('id',1).single();
    if(data){
      if(data.committee_name) document.getElementById('uiCommittee').textContent = data.committee_name;
      if(data.school_name && data.well_name) document.getElementById('uiSchoolWell').textContent = data.school_name + ' - ' + data.well_name;
      if(data.subtitle) document.getElementById('uiSubtitle').textContent = data.subtitle;
      if(data.accountant_name) document.getElementById('uiAccountant').textContent = data.accountant_name;
      if(data.treasurer_name) document.getElementById('uiTreasurer').textContent = data.treasurer_name;
      if(data.footer_text) document.getElementById('uiFooter').textContent = data.footer_text;
    }
  }catch(e){}
}
async function loadFromCloud(){
  try{
    const { data, error } = await supabaseClient.from('receipts').select('*').order('created_at', {ascending:false});
    if(error) return;
    if(data){
      receipts = data.map(d=>({ id:d.id, section:d.section, type:d.type, receiptNo:d.receipt_no, date:d.date, person:d.person, amount:Number(d.amount), reference:d.reference, statement:d.statement, previous:Number(d.previous||0), final:Number(d.final||0), createdAt:d.created_at }));
      saveLocal(); render();
    }
  }catch(e){}
}
async function syncReceiptToCloud(r){
  if(!isAdmin) return;
  if(!navigator.onLine){
    let q = JSON.parse(localStorage.getItem('ayadi_queue') || '[]');
    q.push(r); localStorage.setItem('ayadi_queue', JSON.stringify(q));
    return;
  }
  await supabaseClient.from('receipts').upsert({
    id: r.id, section: r.section, type: r.type, receipt_no: r.receiptNo,
    date: r.date, person: r.person, amount: r.amount, reference: r.reference,
    statement: r.statement, previous: r.previous, final: r.final, created_at: r.createdAt
  });
}
async function getNextReceiptNo(type){
  const prefix = type==='deposit' ? 'REC' : 'PAY';
  let max = 0;
  try{
    const { data } = await supabaseClient.from('receipts').select('receipt_no').like('receipt_no', prefix+'-%');
    if(data) data.forEach(d=>{ const n = parseInt((d.receipt_no||'').split('-')[1]); if(n>max) max=n; });
  }catch(e){}
  receipts.forEach(r=>{ if(r.receiptNo && r.receiptNo.startsWith(prefix)){ const n=parseInt(r.receiptNo.split('-')[1]); if(n>max) max=n; }});
  return prefix + '-' + String(max+1).padStart(6,'0');
}
async function addReceipt(){
  const type = document.getElementById('fType').value;
  const person = document.getElementById('fPerson').value;
  const amount = Number(document.getElementById('fAmount').value);
  const reference = document.getElementById('fRef').value;
  const statement = document.getElementById('fStatement').value;
  if(!person || !amount) return alert('اكتب الاسم والمبلغ');
  const prev = receipts.filter(x=>x.section===currentSection).reduce((a,b)=> a + (b.type==='deposit'? b.amount : -b.amount), 0);
  const receiptNo = await getNextReceiptNo(type);
  const r = { id: 'id'+Date.now(), section: currentSection, type, receiptNo, date: new Date().toISOString().slice(0,10), person, amount, reference, statement, previous: prev, final: type==='deposit'? prev+amount : prev-amount, createdAt: new Date().toISOString() };
  receipts.unshift(r);
  saveLocal();
  await syncReceiptToCloud(r);
  render();
  document.getElementById('fPerson').value=''; document.getElementById('fAmount').value=''; document.getElementById('fRef').value=''; document.getElementById('fStatement').value='';
  alert('تم حفظ الإيصال: ' + receiptNo);
}
async function deleteReceipt(id){
  if(!isAdmin) return alert('للأدمن فقط');
  if(!confirm('متأكد تحذف؟')) return;
  receipts = receipts.filter(x=>x.id!==id);
  saveLocal(); render();
  if(navigator.onLine){
    await supabaseClient.from('receipts').delete().eq('id', id);
  } else {
    let q = JSON.parse(localStorage.getItem('ayadi_delete_queue') || '[]');
    q.push(id); localStorage.setItem('ayadi_delete_queue', JSON.stringify(q));
  }
}
function render(){
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  let list = receipts.filter(x=>x.section===currentSection);
  if(q) list = list.filter(x=> (x.person+x.statement+x.receiptNo).toLowerCase().includes(q));
  const bal = (sec)=> receipts.filter(x=>x.section===sec).reduce((a,b)=> a + (b.type==='deposit'? b.amount : -b.amount), 0);
  document.getElementById('balCommittee').textContent = bal('committee').toLocaleString();
  document.getElementById('balSchool').textContent = bal('school').toLocaleString();
  document.getElementById('balWell').textContent = bal('well').toLocaleString();
  document.getElementById('list').innerHTML = list.map(r=>`
    <div class="receipt">
      <b>${r.type==='deposit'?'توريد':'صرف'} - ${r.receiptNo}</b>
      <p style="margin:6px 0"><b>${r.person}</b> - ${r.amount.toLocaleString()} جنيه</p>
      <p class="muted" style="margin:0">${r.statement||''}</p>
      <p class="muted">التاريخ: ${r.date} | المرجع: ${r.reference||''} | السابق: ${r.previous.toLocaleString()} | النهائي: ${r.final.toLocaleString()}</p>
      ${isAdmin ? `<div class="row"><button onclick="deleteReceipt('${r.id}')">حذف</button><button onclick="window.print()">طباعة</button></div>` : ''}
    </div>`).join('') || '<p style="text-align:center;color:#666">لا توجد إيصالات</p>';
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(receipts)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ayadi-backup.json'; a.click();
}
window.addEventListener('online', async () => {
  let q = JSON.parse(localStorage.getItem('ayadi_queue') || '[]');
  for(let r of q){ await syncReceiptToCloud(r); }
  localStorage.setItem('ayadi_queue', '[]');
  let dq = JSON.parse(localStorage.getItem('ayadi_delete_queue') || '[]');
  for(let id of dq){ await supabaseClient.from('receipts').delete().eq('id', id); }
  localStorage.setItem('ayadi_delete_queue', '[]');
  await loadFromCloud();
});
supabaseClient.auth.getSession().then(({data})=>{ if(data.session){ isAdmin=true; localStorage.setItem('ayadi_isAdmin','true'); updateUIForRole(); } });
updateUIForRole();
render();
loadSettings();
loadFromCloud();
</script>
</body>
</html>
