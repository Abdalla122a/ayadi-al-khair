name: APK بناء ملف

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          rm -f capacitor.config.ts capacitor.config.mts capacitor.config.cts
          if [ ! -f package.json ]; then npm init -y; fi
          npm install --no-audit --no-fund @capacitor/core @capacitor/cli typescript

      - name: Prepare web assets
        run: |
          rm -f capacitor.config.ts capacitor.config.mts capacitor.config.cts
          printf '{"appId":"com.aljawda.alkodrhn","appName":"Ayadi Al Khair","webDir":"www"}' > capacitor.config.json
          mkdir -p www
          cp index.html www/index.html
          cat capacitor.config.json

      - name: Add Android
        run: npx cap add android || true

      - name: Sync Android
        run: |
          rm -f capacitor.config.ts capacitor.config.mts capacitor.config.cts
          printf '{"appId":"com.aljawda.alkodrhn","appName":"Ayadi Al Khair","webDir":"www"}' > capacitor.config.json
          npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayadi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
