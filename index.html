function ensureSectionsAndTheme(){

    data.sections=clone(defaultData.sections);
    changed=true;
  }
  const wellSec=data.sections.find(x=>x.id==='well');
  if(!wellSec){
    data.sections.push({id:'well',name:data.settings?.wellName||'قسم البئر والحفير',subtitle:'إيصالات بئر وحفير الهدى الخضراء',enabled:true,prefix:'WELL-',icon:'💧'});

  }else if(wellSec.enabled===false){
    wellSec.enabled=true;
    changed=true;
  }
  if(!data.counters||typeof data.counters!=='object'){
    data.counters=clone(defaultData.counters);
    changed=true;
  }
  for(const sec of data.sections){
    if(data.counters[sec.id+'_deposit']==null){data.counters[sec.id+'_deposit']=1;changed=true}
    if(data.counters[sec.id+'_expense']==null){data.counters[sec.id+'_expense']=1;changed=true}
  }
  if(data.settings){
    if(data.settings.appColor)document.documentElement.style.setProperty('--green',data.settings.appColor);
    if(data.settings.appColor2)document.documentElement.style.setProperty('--green2',data.settings.appColor2);
    if(data.settings.appFont)document.body.style.fontFamily=data.settings.appFont;
  }

}

function clone(o){return JSON.parse(JSON.stringify(o))}
function hasReceipts(x){return !!(x && Array.isArray(x.receipts))}
function unwrapRecovery(x){
  let p=x;
  for(let i=0;i<8 && p;i++){
    if(Array.isArray(p)) return {receipts:p};
    if(hasReceipts(p)) return p;
    if(p.data) {p=p.data; continue}
    if(p.payload) {p=p.payload; continue}
    if(p.state) {p=p.state; continue}
    if(p.backup) {p=p.backup; continue}
    if(p.appData) {p=p.appData; continue}
    if(p.store) {p=p.store; continue}
    break;
  }
  return null;
}
function readStored(key){
  try{let raw=localStorage.getItem(key); if(!raw)return null; return unwrapRecovery(JSON.parse(raw));}
  catch(e){return null}
}
function loadData(){
  try{
    let raw=localStorage.getItem(LS_KEY);
    let current=raw ? readStored(LS_KEY) : null;
    if(hasReceipts(current) && current.receipts.length){
      const merged=mergeDefaults(defaultData,current);
      if(localStorage.getItem('AYADI_BUNDLED_VERSION')!=='2026-09-27-full' && merged.receipts.length < BUNDLED_DATA.receipts.length){
        const byId=new Map(merged.receipts.map(r=>[String(r.id),r]));
        for(const br of BUNDLED_DATA.receipts){if(!byId.has(String(br.id)))merged.receipts.push(br)}
        merged.counters=mergeDefaults(BUNDLED_DATA.counters,merged.counters||{});
      }
      try{localStorage.setItem('AYADI_BUNDLED_VERSION','2026-09-27-full')}catch(e){}
      return merged;
    }

    for(const key of LEGACY_KEYS){
      if(key===LS_KEY) continue;
      const legacy=readStored(key);
      if(hasReceipts(legacy) && legacy.receipts.length){
        const migrated=mergeDefaults(defaultData,legacy);
        localStorage.setItem(LS_KEY,JSON.stringify(migrated));
        localStorage.setItem(BOOTSTRAP_KEY,'1');
        return migrated;
      }
    }

    if(!localStorage.getItem(BOOTSTRAP_KEY)){
      const seeded=mergeDefaults(defaultData,BUNDLED_DATA);
      localStorage.setItem(LS_KEY,JSON.stringify(seeded));
      localStorage.setItem(BOOTSTRAP_KEY,'1');
      localStorage.setItem('AYADI_BUNDLED_VERSION','2026-09-27-full');
      return seeded;
    }
    return current ? mergeDefaults(defaultData,current) : clone(defaultData);
  }catch(e){return clone(defaultData)}
}
function mergeDefaults(def,obj){
  let out=Array.isArray(def)?[]:{};
  for(let k in def){
    if(obj&&Object.prototype.hasOwnProperty.call(obj,k)){
      out[k]=(typeof def[k]==='object'&&def[k]!==null&&!Array.isArray(def[k]))?mergeDefaults(def[k],obj[k]):obj[k];
    }else out[k]=def[k];
  }
  if(obj) for(let k in obj){ if(!Object.prototype.hasOwnProperty.call(out,k)) out[k]=obj[k]; }
  return out;
}

const AYADI_IDB_NAME='AyadiKhairDurableDB', AYADI_IDB_STORE='appdata';
function openAyadiIDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));const req=indexedDB.open(AYADI_IDB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(AYADI_IDB_STORE))db.createObjectStore(AYADI_IDB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('IndexedDB open failed'))})}
async function persistAyadiIDB(value,stamp){try{const db=await openAyadiIDB();await new Promise((resolve,reject)=>{const tx=db.transaction(AYADI_IDB_STORE,'readwrite');tx.objectStore(AYADI_IDB_STORE).put({data:clone(value),savedAt:stamp||new Date().toISOString()},'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});db.close();return true}catch(e){return false}}

function updateFinalHint(section,type){let a=Number($('amount').value||0), prev=balance(section), final=prev+(type==='deposit'?a:-a); $('finalHint').textContent=`الرصيد السابق: ${money(prev)} جنيه • الرصيد بعد العملية: ${money(final)} جنيه`}
function readForm(section,type){let amount=Number(($('amount')||{}).value||0); let prev=balance(section); return {id:'TEMP',section,type,receiptNo:($('receiptNo')||{}).value||nextNo(section,type),date:($('date')||{}).value||today(),person:($('person')||{}).value||'',amount,reference:($('ref')||{}).value||'',statement:($('statement')||{}).value||'',previous:prev,final:prev+(type==='deposit'?amount:-amount),createdAt:new Date().toISOString()}}
function validateTx(tx){ if(!tx.person.trim()){toast('اكتب الاسم أولًا'); return false} if(!Number.isFinite(tx.amount)||tx.amount<=0){toast('اكتب مبلغ صحيح'); return false} if(!tx.statement.trim()){toast('اكتب البيان'); return false} return true}
async function previewTemp(section,type){let tx=readForm(section,type); if(!validateTx(tx))return; activePreview=tx; $('previewBox').style.display='block'; await drawReceiptToCanvas(tx,$('receiptCanvas')); $('previewBox').scrollIntoView({behavior:'smooth',block:'start'})}
async function saveReceipt(section,type){
  if(!window.AYADI_IS_ADMIN){toast('الإضافة متاحة للأدمن فقط');return}
  let tx=readForm(section,type);
  if(!validateTx(tx))return;
  let key=counterKey(section,type);
  tx.id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const p=prefix(section,type);
  const n=Math.max(maxNoFor(p)+1,(await ayadiCloudMaxNo(p))+1,Number(data.counters[key])||1);
  tx.receiptNo=p+String(n).padStart(6,'0');
  data.counters[key]=n+1;
  data.receipts.unshift(tx);
  recalculateBalances();
  const updated=data.receipts.find(x=>x.id===tx.id)||tx;
  saveData();
  toast(type==='deposit'?'تم حفظ التوريد وإضافته للرصيد':'تم حفظ الصرف وخصمه من الرصيد');
  activePreview=updated;
  $('receiptNo').value=nextNo(section,type);
  await drawReceiptToCanvas(updated,$('receiptCanvas'));
  $('previewBox').style.display='block';
  updateFinalHint(section,type);
}

let histSection='all',histQuery='';
function historyList(){const q=ayadiNormDigits0(histQuery).trim().toLowerCase();return data.receipts.filter(r=>(histSection==='all'||r.section===histSection)&&(!q||ayadiNormDigits0([r.receiptNo,r.person,r.statement,r.reference,r.date,r.amount,money(r.amount),sectionName(r.section)].join(' ')).toLowerCase().includes(q)))}
function ayadiNormDigits0(t){return String(t==null?'':t).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))}

function renderRecords(list){ if(!list.length)return '<div class="empty">لا توجد إيصالات محفوظة حتى الآن</div>'; return list.map(r=>`<div class="record"><div class="rtitle">${typeTitle(r.type)} • ${escapeHtml(r.receiptNo)}</div><div class="rmeta">${escapeHtml(r.date)} • ${escapeHtml(sectionName(r.section))} • ${escapeHtml(r.person)}</div><div class="amount ${r.type==='deposit'?'greenText':'redText'}">${r.type==='deposit'?'+':'-'} ${money(r.amount)} جنيه</div><div class="actions"><button class="btn small blue" onclick="openReceipt('${escapeHtml(r.id)}')">فتح الإيصال</button>${window.AYADI_IS_ADMIN?`<button class="btn small" onclick="editReceipt('${escapeHtml(r.id)}')">تعديل</button><button class="btn small maroon" onclick="deleteReceipt('${escapeHtml(r.id)}')">حذف</button>`:''}</div></div>`).join('')}

function editReceipt(id){if(!window.AYADI_IS_ADMIN){toast('التعديل متاح للأدمن فقط');return}const r=data.receipts.find(x=>x.id===id);if(!r)return;stack.push(currentView);currentView='editReceipt';setHeader('تعديل الإيصال',`${typeTitle(r.type)} • ${r.receiptNo}`,r.section);const label=r.type==='deposit'?'اسم المورد / الدافع':'اسم المستفيد';$('app').innerHTML=`<section class="card"><h2>✏️ تعديل بيانات الإيصال ${escapeHtml(r.receiptNo)}</h2><div class="form"><label>رقم الإيصال</label><input value="${escapeHtml(r.receiptNo)}" disabled><label>التاريخ</label><input id="editDate" type="date" value="${escapeHtml(r.date)}"><label>${label}</label><input id="editPerson" value="${escapeHtml(r.person)}"><label>المبلغ بالجنيه</label><input id="editAmount" type="number" inputmode="numeric" value="${Number(r.amount)||0}"><label>رقم العملية / المرجع</label><input id="editRef" value="${escapeHtml(r.reference||'')}"><label>البيان</label><textarea id="editStatement">${escapeHtml(r.statement||'')}</textarea><div class="actions"><button class="btn" onclick="saveReceiptEdit('${escapeHtml(r.id)}')">حفظ التعديلات</button><button class="btn gray" onclick="showHistory(false,'${escapeHtml(r.section)}')">إلغاء</button></div></div></section>`;$('backBtn').style.display='block'}
function saveReceiptEdit(id){if(!window.AYADI_IS_ADMIN){toast('التعديل متاح للأدمن فقط');return}const r=data.receipts.find(x=>x.id===id);if(!r)return;const person=$('editPerson').value.trim(),amount=Number($('editAmount').value);if(!person){toast('اكتب الاسم أولًا');return}if(!Number.isFinite(amount)||amount<=0){toast('اكتب مبلغًا صحيحًا');return}r.date=$('editDate').value||r.date;r.person=person;r.amount=amount;r.reference=$('editRef').value.trim();r.statement=$('editStatement').value.trim();recalculateBalances();if(!saveData()){toast('لم يتم تأكيد الحفظ');return}toast('تم تعديل الإيصال وتحديث الأرصدة');showHistory(false,r.section)}
function recalculateBalances(){
  const ordered=[...data.receipts].sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))||String(a.id||'').localeCompare(String(b.id||'')));
  const running={};
  for(const r of ordered){
    const prev=Number(running[r.section]||0);
    r.previous=prev;
    r.final=prev+(r.type==='deposit'?Number(r.amount||0):-Number(r.amount||0));
    running[r.section]=r.final;
  }
}

function ayadiFetch(url, opts = {}, ms = 15000) {
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), ms) : 0;
  return fetch(url, ctl ? { ...opts, signal: ctl.signal } : opts)
    .catch(e => {
      throw new Error(e && e.name === 'AbortError' ? 'انتهت مهلة الاتصال' : 'تعذر الاتصال بالخادم');
    })
    .finally(() => clearTimeout(t));
}

function saveFbSession(session) {
  fbSession = session;
  if (session) {
    localStorage.setItem('AYADI_FB_SESSION', JSON.stringify(session));
    localStorage.setItem('ayadi_fb_session', JSON.stringify(session));
  } else {
    localStorage.removeItem('AYADI_FB_SESSION');
    localStorage.removeItem('ayadi_fb_session');
  }
}

async function fbSignIn(email, password) {
  const res = await ayadiFetch(`${FB_AUTH_BASE}/accounts:signInWithPassword?key=${FIREBASE_CONFIG.apiKey}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: String(email || '').trim(),
      password,
      returnSecureToken: true
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const code = data?.error?.message || '';
    if (/INVALID_LOGIN_CREDENTIALS|EMAIL_NOT_FOUND|INVALID_PASSWORD/i.test(code)) {
      throw new Error('بيانات الدخول غير صحيحة');
    }
    if (/USER_DISABLED/i.test(code)) {
      throw new Error('هذا الحساب معطّل');
    }
    throw new Error(code || 'فشل تسجيل الدخول في Firebase');
  }
  const session = {
    email: (data.email || email || '').toLowerCase(),
    localId: data.localId || '',
    idToken: data.idToken,
    refreshToken: data.refreshToken,
    expiresAt: Date.now() + Number(data.expiresIn || 3600) * 1000
  };
  saveFbSession(session);
  return session;
}

async function fbGetValidToken() {
  if (!fbSession || !fbSession.refreshToken) return null;
  if (fbSession.expiresAt && Date.now() < fbSession.expiresAt - 60000 && fbSession.idToken) {
    return fbSession.idToken;
  }
  if (!ayadiRefreshing) {
    ayadiRefreshing = (async () => {
      try {
        const res = await ayadiFetch(`${FB_AUTH_BASE}/token?key=${FIREBASE_CONFIG.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grant_type: 'refresh_token',
            refresh_token: fbSession.refreshToken
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.id_token) return null;
        fbSession = {
          ...fbSession,
          email: (fbSession.email || '').toLowerCase(),
          idToken: data.id_token,
          refreshToken: data.refresh_token || fbSession.refreshToken,
          expiresAt: Date.now() + Number(data.expires_in || 3600) * 1000
        };
        saveFbSession(fbSession);
        return fbSession.idToken;
      } catch (e) {
        return null;
      } finally {
        setTimeout(() => { ayadiRefreshing = null; }, 0);
      }
    })();
  }
  return ayadiRefreshing;
}

function fbSignOut() {
  saveFbSession(null);
  window.AYADI_IS_ADMIN = false;
  window.AYADI_IS_SUPERVISOR = false;
  window.AYADI_CAN_ADD_CONTENT = false;
}

function toFirestoreValue(val) {
  if (val === null || val === undefined) return { nullValue: null };
  if (typeof val === 'boolean') return { booleanValue: val };
  if (typeof val === 'number') {
    return Number.isInteger(val) ? { integerValue: String(val) } : { doubleValue: val };
  }
  if (typeof val === 'string') return { stringValue: val };
  if (Array.isArray(val)) {
    return { arrayValue: { values: val.map(toFirestoreValue) } };
  }
  if (typeof val === 'object') {
    const fields = {};
    for (const [k, v] of Object.entries(val)) {
      if (v !== undefined) fields[k] = toFirestoreValue(v);
    }
    return { mapValue: { fields } };
  }
  return { stringValue: String(val) };
}

function fromFirestoreValue(fsVal) {
  if (!fsVal || typeof fsVal !== 'object') return null;
  if ('nullValue' in fsVal) return null;
  if ('booleanValue' in fsVal) return fsVal.booleanValue;
  if ('integerValue' in fsVal) return Number(fsVal.integerValue);
  if ('doubleValue' in fsVal) return Number(fsVal.doubleValue);
  if ('stringValue' in fsVal) return fsVal.stringValue;
  if ('arrayValue' in fsVal) {
    return (fsVal.arrayValue?.values || []).map(fromFirestoreValue);
  }
  if ('mapValue' in fsVal) {
    const obj = {};
    for (const [k, v] of Object.entries(fsVal.mapValue?.fields || {})) {
      obj[k] = fromFirestoreValue(v);
    }
    return obj;
  }
  return null;
}

function docToObject(doc) {
  const obj = {};
  for (const [k, v] of Object.entries(doc.fields || {})) {
    obj[k] = fromFirestoreValue(v);
  }
  const parts = (doc.name || '').split('/');
  if (!obj.id && parts.length) obj.id = parts[parts.length - 1];
  return obj;
}

async function fbGetDoc(collectionName, docId) {
  const token = await fbGetValidToken();
  const headers = {};
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const url = `${FB_REST_BASE}/${collectionName}/${encodeURIComponent(String(docId))}`;
  const res = await ayadiFetch(url, { headers });
  if (res.status === 404) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data?.error?.message || `فشل قراءة المستند من ${collectionName}`);
    err.status = res.status;
    throw err;
  }
  return docToObject(data);
}

async function fbUpsertDoc(collectionName, docId, payload) {
  const token = await fbGetValidToken();
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const fields = {};
  for (const [k, v] of Object.entries(payload || {})) {
    if (v !== undefined) fields[k] = toFirestoreValue(v);
  }
  const url = `${FB_REST_BASE}/${collectionName}/${encodeURIComponent(String(docId))}`;
  const res = await ayadiFetch(url, {
    method: 'PATCH',
    headers,
    body: JSON.stringify({ fields })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data?.error?.message || `فشل حفظ المستند في ${collectionName}`);
    err.status = res.status;
    throw err;
  }
  return docToObject(data);
}

async function fbListDocs(collectionName) {
  const token = await fbGetValidToken();
  const headers = {};
  if (token) headers['Authorization'] = `Bearer ${token}`;
  let all = [];
  let pageToken = '';
  do {
    const q = new URLSearchParams({ pageSize: '1000' });
    if (pageToken) q.set('pageToken', pageToken);
    const url = `${FB_REST_BASE}/${collectionName}?${q.toString()}`;
    const res = await ayadiFetch(url, { headers });
    if (res.status === 404) return [];
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data?.error?.message || `فشل قراءة ${collectionName}`);
      err.status = res.status;
      throw err;
    }
    all = all.concat((data.documents || []).map(docToObject));
    pageToken = data.nextPageToken || '';
  } while (pageToken);
  return all;
}

async function fbDeleteDoc(collectionName, docId) {
  const token = await fbGetValidToken();
  const headers = {};
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const url = `${FB_REST_BASE}/${collectionName}/${encodeURIComponent(String(docId))}`;
  const res = await ayadiFetch(url, { method: 'DELETE', headers });
  if (!res.ok && res.status !== 404) {
    const data = await res.json().catch(() => ({}));
    const err = new Error(data?.error?.message || `فشل حذف المستند من ${collectionName}`);
    err.status = res.status;
    throw err;
  }
}

function ayadiNormDigits(t) { return ayadiNormDigits0(t).replace(/\D/g, ''); }
function ayadiIdToEmail(id) {
  id = String(id || '').trim();
  if (id.includes('@')) return id.toLowerCase();
  const d = ayadiNormDigits(id);
  return d ? ('p' + d + '@' + AYADI_PHONE_DOMAIN) : '';
}

function ayadiApplyRoleSync() {
  const email = (fbSession?.email || '').toLowerCase();
  window.AYADI_IS_ADMIN = !!email && email === AYADI_ADMIN_EMAIL.toLowerCase();
  window.AYADI_IS_SUPERVISOR = !window.AYADI_IS_ADMIN && !!email && localStorage.getItem('AYADI_SUP_' + email) === '1';
  window.AYADI_CAN_ADD_CONTENT = window.AYADI_IS_ADMIN || window.AYADI_IS_SUPERVISOR;
}

async function ayadiRefreshRole() {
  ayadiApplyRoleSync();
  const email = (fbSession?.email || '').toLowerCase();
  if (email && !window.AYADI_IS_ADMIN) {
    try {
      const doc = await fbGetDoc('app_supervisors', encodeURIComponent(email));
      window.AYADI_IS_SUPERVISOR = !!doc;
      try { localStorage.setItem('AYADI_SUP_' + email, window.AYADI_IS_SUPERVISOR ? '1' : '0'); } catch (e) {}
    } catch (e) {}
  }
  window.AYADI_CAN_ADD_CONTENT = window.AYADI_IS_ADMIN || window.AYADI_IS_SUPERVISOR;
}

async function ayadiLogout() {
  if (window.AYADI_IS_ADMIN && localStorage.getItem('AYADI_DIRTY')) {
    if (navigator.onLine) await ayadiSyncNow();
    if (localStorage.getItem('AYADI_DIRTY')) {
      if (!confirm('توجد تعديلات لم تُرفع للسحابة بعد. تسجيل الخروج الآن قد يفقدها. هل تريد المتابعة؟')) return;
      localStorage.removeItem('AYADI_DIRTY');
    }
  }
  fbSignOut();
  stack = [];
  showHome(false);
  toast('تم تسجيل الخروج');
  ayadiLoadCloud(true);
}

async function ayadiLogin(ev) {
  ev?.preventDefault();
  const err = document.getElementById('adminLoginError');
  const btn = document.querySelector('.adminLoginSubmit');
  const email = ayadiIdToEmail(document.getElementById('adminEmail')?.value || '');
  const password = document.getElementById('adminPassword')?.value || '';
  if (err) err.textContent = '';
  if (!email || !password) {
    if (err) err.textContent = 'أدخل البريد أو رقم الهاتف وكلمة المرور';
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ تسجيل الدخول...'; }
  try {
    await fbSignIn(email, password);
    await ayadiRefreshRole();
    if (!window.AYADI_IS_ADMIN && !window.AYADI_IS_SUPERVISOR) {
      fbSignOut();
      throw new Error('هذا الحساب غير مخوّل بالدخول');
    }
    stack = [];
    if (window.AYADI_IS_ADMIN) showSettings(false);
    else showHome(false);
    ayadiLoadCloud(true);
  } catch (e) {
    if (err) err.textContent = e.message || 'فشل تسجيل الدخول؛ تحقق من الاتصال والبيانات';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'تسجيل الدخول'; }
  }
}

async function addSupervisor() {
  if (!window.AYADI_IS_ADMIN) { toast('هذه الوظيفة متاحة للمدير فقط'); return; }
  const digits = ayadiNormDigits($('supervisorPhone').value);
  const pass = $('supervisorPass').value;
  if (digits.length < 7) { toast('أدخل رقم هاتف صحيحاً'); return; }
  if (pass.length < 6) { toast('كلمة المرور 6 أحرف على الأقل'); return; }
  const email = ayadiIdToEmail(digits);
  try {
    const r = await ayadiFetch(`${FB_AUTH_BASE}/accounts:signUp?key=${FIREBASE_CONFIG.apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass, returnSecureToken: false })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok && !/EMAIL_EXISTS/i.test(j?.error?.message || '')) {
      toast('تعذر إنشاء حساب المشرف: ' + (j?.error?.message || r.status));
      return;
    }
  } catch (e) {
    toast(e.message);
    return;
  }
  try {
    await fbUpsertDoc('app_supervisors', encodeURIComponent(email), {
      email,
      phone: digits,
      createdAt: new Date().toISOString()
    });
  } catch (e) {
    toast('تعذرت إضافة المشرف: ' + e.message);
    return;
  }
  toast('تمت إضافة المشرف');
  $('supervisorPhone').value = '';
  $('supervisorPass').value = '';
  loadSupervisors();
}

async function loadSupervisors() {
  const el = $('supervisorList');
  if (!el) return;
  let rows;
  try {
    rows = await fbListDocs('app_supervisors');
  } catch (e) {
    el.textContent = 'تعذر تحميل المشرفين: ' + e.message;
    return;
  }
  rows.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  el.innerHTML = (rows || []).map(x => '<div class="record"><span dir="ltr">' + escapeHtml(x.phone || x.email) + '</span> <button type="button" class="btn small maroon" data-remove-supervisor="' + encodeURIComponent(x.email) + '">إزالة</button></div>').join('') || 'لا يوجد مشرفون';
  el.querySelectorAll('[data-remove-supervisor]').forEach(b => b.addEventListener('click', () => removeSupervisor(b.dataset.removeSupervisor)));
}

async function removeSupervisor(e) {
  const email = decodeURIComponent(e);
  if (!confirm('إزالة صلاحية المشرف؟')) return;
  try {
    await fbDeleteDoc('app_supervisors', encodeURIComponent(email));
  } catch (err) {
    toast('تعذرت إزالة المشرف');
    return;
  }
  loadSupervisors();
}

async function addSupervisorNote() {
  if (!window.AYADI_IS_SUPERVISOR) return;
  const title = prompt('عنوان الإضافة');
  if (!title) return;
  const note = prompt('تفاصيل الإضافة') || '';
  try {
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await fbUpsertDoc('app_supervisor_entries', id, {
      id,
      title,
      body: note,
      createdBy: fbSession?.email || fbSession?.localId || '',
      createdAt: new Date().toISOString()
    });
    toast('تمت الإضافة بنجاح');
    showHome(false);
  } catch (e) {
    toast('تعذرت الإضافة: ' + e.message);
  }
}

function ayadiNormalizeReceiptDoc(r) {
  return {
    id: String(r.id),
    section: r.section,
    type: r.type,
    receiptNo: r.receiptNo || r.receipt_no || '',
    date: r.date || '',
    person: r.person || '',
    amount: Number(r.amount) || 0,
    reference: r.reference || '',
    statement: r.statement || '',
    previous: Number(r.previous) || 0,
    final: Number(r.final) || 0,
    createdAt: r.createdAt || r.created_at || new Date().toISOString()
  };
}

async function ayadiFetchAllReceipts() {
  const rows = await fbListDocs('receipts');
  if (!Array.isArray(rows)) throw new Error('استجابة غير متوقعة');
  rows.sort((a, b) => String(b.createdAt || b.created_at || '').localeCompare(String(a.createdAt || a.created_at || '')) || String(a.id || '').localeCompare(String(b.id || '')));
  return rows;
}

async function ayadiLoadCloud(silent = false) {
  if (ayadiLoadBusy) return;
  ayadiLoadBusy = true;
  try {
    if (localStorage.getItem('AYADI_DIRTY')) {
      if (window.AYADI_IS_ADMIN) {
        window.AYADI_CLOUD_READY = true;
        await ayadiSyncNow();
      }
      return;
    }
    const rows = await ayadiFetchAllReceipts();
    let ss = null;
    try { ss = await fbGetDoc('settings', 'main'); } catch (e) {}
    const synced = !!(ss && (ss.synced || (ss.app_data && ss.app_data.synced)));
    if (rows.length || synced) {
      data.receipts = rows.map(ayadiNormalizeReceiptDoc);
    } else if (window.AYADI_IS_ADMIN && data.receipts.length) {
      try { localStorage.setItem('AYADI_DIRTY', '1'); } catch (e) {}
    }
    if (ss) {
      const ad = ss.app_data && typeof ss.app_data === 'object' ? ss.app_data : ss;
      if (ad && typeof ad === 'object') {
        if (ad.settings && typeof ad.settings === 'object') {
          data.settings = { ...data.settings, ...ad.settings };
        }
        if (Array.isArray(ad.sections) && ad.sections.length) {
          data.sections = ad.sections;
        }
        if (ad.counters && typeof ad.counters === 'object') {
          for (const k of Object.keys(ad.counters)) {
            data.counters[k] = Math.max(Number(data.counters[k]) || 1, Number(ad.counters[k]) || 1);
          }
        }
      }
    }
    ensureSectionsAndTheme();
    recalculateBalances();
    await shrinkStoredImages();
    saveData(false);
    window.AYADI_CLOUD_READY = true;
    if (window.AYADI_IS_ADMIN && localStorage.getItem('AYADI_DIRTY')) await ayadiSyncNow();
    if (currentView === 'home') showHome(false);
    else if (currentView === 'history' && !(document.activeElement && document.activeElement.id === 'histSearch')) showHistory(false, histSection);
    if (!silent) toast('تم تحديث البيانات من السحابة');
  } catch (e) {
    console.warn('Cloud read:', e);
    if (!silent) toast('تعذر تحديث السحابة؛ البيانات المحلية محفوظة');
  } finally {
    ayadiLoadBusy = false;
  }
}

const ayadiPending = () => { try { return JSON.parse(localStorage.getItem('AYADI_PENDING_DELETE_IDS') || '[]'); } catch (e) { return []; } };
const ayadiSetPending = a => { try { localStorage.setItem('AYADI_PENDING_DELETE_IDS', JSON.stringify([...new Set(a)])); } catch (e) {} };

async function ayadiDeleteRow(id) {
  await fbDeleteDoc('receipts', String(id));
  return true;
}

async function ayadiDeleteCloud(id) {
  ayadiSetPending([...ayadiPending(), String(id)]);
  if (!window.AYADI_IS_ADMIN || !navigator.onLine) return false;
  try {
    await ayadiDeleteRow(id);
    ayadiSetPending(ayadiPending().filter(x => x !== String(id)));
    return true;
  } catch (e) {
    return false;
  }
}

async function ayadiSyncNow() {
  if (!window.AYADI_IS_ADMIN || ayadiSyncBusy || !window.AYADI_CLOUD_READY) return false;
  ayadiSyncBusy = true;
  const seq = window.__ayadiSeq || 0;
  try {
    const left = [];
    for (const id of ayadiPending()) {
      try {
        await ayadiDeleteRow(id);
      } catch (e) {
        left.push(id);
        if (!navigator.onLine || /PERMISSION_DENIED|صلاحية/i.test(e.message)) throw e;
      }
    }
    ayadiSetPending(left);
    const pend = new Set(left);
    const rows = data.receipts.filter(r => !pend.has(String(r.id))).map(ayadiNormalizeReceiptDoc);
    for (const row of rows) {
      await fbUpsertDoc('receipts', row.id, row);
    }
    await fbUpsertDoc('settings', 'main', {
      id: 'main',
      synced: true,
      updatedAt: new Date().toISOString(),
      settings: data.settings,
      sections: data.sections,
      counters: data.counters
    });
    if ((window.__ayadiSeq || 0) === seq && !left.length) localStorage.removeItem('AYADI_DIRTY');
    return true;
  } catch (e) {
    console.warn('Cloud sync failed:', e);
    if (navigator.onLine) toast('تعذرت المزامنة: ' + e.message);
    return false;
  } finally {
    ayadiSyncBusy = false;
  }
}

window.AYADI_QUEUE_SYNC = () => { clearTimeout(window.__ayadiSyncTimer); window.__ayadiSyncTimer = setTimeout(ayadiSyncNow, 700); };

async function deleteReceipt(id) {
  if (!window.AYADI_IS_ADMIN) { toast('الحذف متاح للمدير فقط'); return; }
  if (!confirm('هل تريد حذف هذا الإيصال؟ سيُحذف من الجهاز ومن السحابة.')) return;
  data.receipts = data.receipts.filter(r => String(r.id) !== String(id));
  recalculateBalances();
  saveData(false);
  const ok = await ayadiDeleteCloud(id);
  if (!ok) { localStorage.setItem('AYADI_DIRTY', '1'); if (window.AYADI_QUEUE_SYNC) window.AYADI_QUEUE_SYNC(); }
  toast(ok ? 'تم حذف الإيصال من الجهاز والسحابة' : 'تم الحذف محلياً وسيُحذف من السحابة عند توفر الاتصال');
  showHistory(false, histSection);
}

async function ayadiInit() {
  ayadiApplyRoleSync();
  if (fbSession && fbSession.refreshToken) {
    await fbGetValidToken();
    await ayadiRefreshRole();
  }
  await ayadiLoadCloud(true);
  setInterval(() => { if (navigator.onLine && !document.hidden) ayadiLoadCloud(true); }, 20000);
  window.addEventListener('online', () => ayadiLoadCloud(true));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && navigator.onLine) ayadiLoadCloud(true); });
}
